<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>太空飄飄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090b16;
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            touch-action: none; /* 防止手機滑動捲動網頁 */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 玻璃擬態 UI */
        .glass-panel {
            background: rgba(18, 22, 43, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .btn-bounce {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
        }
        .btn-bounce:active {
            transform: scale(0.93);
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        .animate-float {
            animation: floatSlow 3.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="relative w-full h-full flex items-center justify-center">

    <!-- 遊戲主畫布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 頂部 HUD 狀態列 (遊戲進行中顯示) -->
    <div id="hudLayer" class="hidden absolute top-0 left-0 w-full p-3 sm:p-5 flex justify-between items-start pointer-events-none z-10">

        <div id="centerHudBox" class="glass-panel rounded-2xl px-2.5 py-2 sm:px-5 sm:py-2.5 flex flex-col items-center shrink-1 mx-1">

            <div id="treasureHudRow" class="hidden grid grid-cols-5 gap-1.5 sm:gap-2 mt-1.5 justify-items-center">

        <div id="haruHudBox" class="glass-panel rounded-2xl px-3 py-2 sm:px-4 sm:py-2.5 flex flex-col items-end gap-1 border-sky-300/30">

    <!-- 音效開關按鈕 (保持與生命值格子的適當距離) -->
    <div id="topControls" class="hidden absolute top-24 sm:top-28 right-3 sm:right-5 flex gap-2 z-20">
        <button id="soundToggleBtn" class="glass-panel w-10 h-10 rounded-full flex items-center justify-center text-white text-lg btn-bounce cursor-pointer" title="切換音效">
            <svg id="soundIcon" class="w-5 h-5 fill-current text-white" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
        </button>
    </div>

    <!-- 開始畫面 Overlay -->
    <div id="startScreen" class="absolute inset-0 flex flex-col items-center justify-center p-3 sm:p-5 z-30 bg-[#090b16]/70 backdrop-blur-sm">
        <div class="glass-panel max-w-md w-full rounded-3xl px-4 py-6 sm:p-8 flex flex-col items-center text-center border-2 border-indigo-400/20">
            <h1 class="text-3xl sm:text-4xl font-black text-white mb-2 tracking-wide drop-shadow-md">
                太空飄飄
            </h1>
            <p class="text-slate-300 text-sm sm:text-base mb-4 leading-relaxed">
                守護可愛的小太空人<span class="text-pink-200 font-bold">Luna</span>與<span class="text-sky-200 font-bold">Haru</span><br>
                閃避危險的隕石與太空碎片
            </p>

            <!-- 角色預覽畫布 (點擊 Luna 或 Haru 可進入各自單人模式) -->
            <div class="w-full h-36 sm:h-40 rounded-2xl bg-[#11152b]/80 border border-white/10 mb-4 flex items-center justify-center overflow-hidden relative">
                <canvas id="previewCanvas" class="w-full h-full cursor-pointer"></canvas>
            </div>

            <!-- 操作與規則說明 (拓寬左右空間讓電腦操作在手機上完整呈現一行) -->
            <div class="w-full bg-white/5 rounded-2xl px-2.5 py-3.5 sm:p-4 mb-5 text-left space-y-1.5 text-[11px] sm:text-sm text-slate-200">
                <div class="flex items-start gap-1.5 sm:gap-2">
                    <span class="text-indigo-300 font-bold">•</span>
                    <span><b>手機操作：</b>用手指拖曳移動小太空人</span>
                </div>
                <div class="flex items-start gap-1.5 sm:gap-2">
                    <span class="text-indigo-300 font-bold">•</span>
                    <span class="whitespace-nowrap"><b>電腦操作：</b>用滑鼠拖曳，或用WASD/方向鍵操縱</span>
                </div>
                <div class="flex items-start gap-1.5 sm:gap-2">
                    <span class="text-indigo-300 font-bold">•</span>
                    <span>兩位小太空人各自有3顆愛心</span>
                </div>
                <div class="flex items-start gap-1.5 sm:gap-2">
                    <span class="text-indigo-300 font-bold">•</span>
                    <span>若失去其中一位小太空人，另一位仍會繼續奮戰</span>
                </div>
            </div>

            <div class="w-full flex flex-col gap-2.5">
                <button id="startBtn" class="w-full py-3.5 sm:py-4 rounded-2xl bg-gradient-to-r from-[#f8a5c2] via-[#c792ea] to-[#82ccdd] text-slate-900 font-black text-lg sm:text-xl btn-bounce cursor-pointer">
                    遊戲開始
                </button>
                <div class="w-full grid grid-cols-2 gap-2.5">
                    <button id="soloModeBtn" class="w-full py-3 rounded-2xl bg-white/10 hover:bg-white/15 border border-pink-300/30 text-pink-100 font-bold text-sm sm:text-base btn-bounce cursor-pointer">
                        單人模式
                    </button>
                    <button id="treasureModeBtn" class="w-full py-3 rounded-2xl bg-white/10 hover:bg-white/15 border border-sky-300/30 text-sky-100 font-bold text-sm sm:text-base btn-bounce cursor-pointer">
                        尋寶模式
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 遊戲結束結算 Overlay -->
    <div id="gameOverScreen" class="hidden absolute inset-0 flex flex-col items-center justify-center p-5 z-30 bg-[#090b16]/80 backdrop-blur-md">
        <div class="glass-panel max-w-sm w-full rounded-3xl p-6 sm:p-8 flex flex-col items-center text-center border-2 border-pink-400/20">
            <h2 id="gameOverTitle" class="text-2xl sm:text-3xl font-black text-white mb-6">遊戲結束</h2>

            <div id="standardResultGrid" class="w-full grid grid-cols-2 gap-3 mb-6">
                <div class="bg-white/5 rounded-2xl p-3 border border-white/10">
                    <div class="text-xs text-slate-400 mb-1">飄流距離</div>
                    <div id="finalScore" class="text-2xl font-black text-pink-300">0 m</div>
                </div>
                <div class="bg-white/5 rounded-2xl p-3 border border-white/10">
                    <div class="text-xs text-slate-400 mb-1">最高紀錄</div>
                    <div id="bestScore" class="text-2xl font-black text-sky-300">0 m</div>
                </div>
            </div>

            <div id="treasureResultBox" class="hidden w-full bg-white/5 rounded-2xl p-4 border border-white/10 mb-6 flex flex-col items-center gap-2">
                <div id="treasureResultSubtitle" class="text-sm text-slate-300 font-bold">已收集友情寶珠</div>
                <div id="treasureResultCount" class="text-2xl font-black text-amber-200">0 / 10</div>
                <div id="treasureResultOrbs" class="flex items-center justify-center gap-1.5 flex-wrap mt-1"></div>
            </div>

            <div class="w-full flex flex-col gap-3">
                <button id="restartBtn" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-[#fbb6d3] to-[#b9dcfa] text-slate-900 font-black text-lg shadow-lg btn-bounce cursor-pointer">
                    再次出發
                </button>
                <button id="homeBtn" class="w-full py-3 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/20 text-white font-bold text-base btn-bounce cursor-pointer">
                    回主畫面
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * 太空飄飄
         * 核心設計：
         * 1. 嚴格還原兩位小太空人角色外觀（Luna 與 Haru），包含漂浮姿態、手部揮動、臉部可愛表情與柔和褐色描邊。
         * 2. 支援雙人經典模式、單人模式（含 Luna 射擊球與 Haru 防護罩專屬道具）與尋寶模式（收集 10 顆柔和彩色寶珠）。
         * 3. 支援多點觸控 (Multi-touch)、滑鼠拖曳與鍵盤 WASD / 方向鍵操作。
         */

        // ==========================================
        // 1. 音效合成器 (Tone.js 無外部音檔依賴)
        // ==========================================
        class SoundManager {
            constructor() {
                this.enabled = true;
                this.initialized = false;
                this.synth = null;
                this.noiseSynth = null;
            }

            async init() {
                if (this.initialized) return;
                try {
                    await Tone.start();
                    this.synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.02, decay: 0.15, sustain: 0.1, release: 0.4 }
                    }).toDestination();
                    this.synth.volume.value = -8;

                    this.noiseSynth = new Tone.NoiseSynth({
                        noise: { type: "brown" },
                        envelope: { attack: 0.01, decay: 0.25, sustain: 0, release: 0.2 }
                    }).toDestination();
                    this.noiseSynth.volume.value = -10;
                    this.initialized = true;
                } catch (e) {
                    console.warn("Audio init skipped:", e);
                }
            }

            playHeal() {
                if (!this.enabled || !this.initialized) return;
                const now = Tone.now();
                this.synth.triggerAttackRelease("C5", "16n", now);
                this.synth.triggerAttackRelease("E5", "16n", now + 0.08);
                this.synth.triggerAttackRelease("G5", "16n", now + 0.16);
                this.synth.triggerAttackRelease("C6", "8n", now + 0.24);
            }

            playHit() {
                if (!this.enabled || !this.initialized) return;
                const now = Tone.now();
                this.noiseSynth.triggerAttackRelease("8n", now);
                this.synth.triggerAttackRelease(["A2", "Eb2"], "8n", now);
            }

            playBomb() {
                if (!this.enabled || !this.initialized) return;
                const now = Tone.now();
                this.noiseSynth.triggerAttackRelease("4n", now);
                this.synth.triggerAttackRelease(["C3", "G2", "D2"], "8n", now);
                this.synth.triggerAttackRelease("F3", "16n", now + 0.12);
            }

            playShoot() {
                if (!this.enabled || !this.initialized) return;
                const now = Tone.now();
                this.synth.triggerAttackRelease("G5", "32n", now);
            }

            playShieldBlock() {
                if (!this.enabled || !this.initialized) return;
                const now = Tone.now();
                this.synth.triggerAttackRelease("B5", "16n", now);
                this.synth.triggerAttackRelease("E6", "16n", now + 0.06);
            }

            playFall() {
                if (!this.enabled || !this.initialized) return;
                const now = Tone.now();
                this.synth.triggerAttackRelease("G4", "8n", now);
                this.synth.triggerAttackRelease("E4", "8n", now + 0.15);
                this.synth.triggerAttackRelease("C4", "8n", now + 0.30);
                this.synth.triggerAttackRelease("G3", "4n", now + 0.45);
            }

            playStart() {
                if (!this.enabled || !this.initialized) return;
                const now = Tone.now();
                this.synth.triggerAttackRelease("E4", "16n", now);
                this.synth.triggerAttackRelease("G4", "16n", now + 0.09);
                this.synth.triggerAttackRelease("B4", "8n", now + 0.18);
            }
        }

        const sound = new SoundManager();

        // ==========================================
        // 2. 角色高精度繪製系統 (忠實還原原圖設計)
        // ==========================================
        /**
         * 繪製小太空人
         * @param {CanvasRenderingContext2D} ctx 畫布上下文
         * @param {Object} astro 太空人狀態物件
         */
        function drawAstronaut(ctx, astro) {
            ctx.save();
            ctx.translate(astro.x, astro.y);

            // 受傷無敵閃爍效果（若處於爆炸亂彈狀態則維持完整可見以便看清亂彈動態）
            if (astro.alive && astro.invulnTimer > 0 && !(astro.bounceTimer > 0)) {
                if (Math.floor(astro.invulnTimer * 16) % 2 === 0) {
                    ctx.globalAlpha = 0.45;
                }
            }

            // 失去三條命後的狀態：顏色漸暗（使用高效能色彩插值取代逐幀動態 CSS filter，避免手機與電腦瀏覽器卡頓）
            if (!astro.alive) {
                ctx.rotate(astro.fallRotation);
            } else {
                // 使用經過平滑插值的 currentAngle，讓左右傾斜旋轉更加絲滑流暢
                ctx.rotate(astro.currentAngle || 0);
            }

            const s = astro.scale;
            ctx.scale(s, s);

            // 色彩線性插值輔助函式（用於被擊墜後平滑變暗變灰，效能極佳零卡頓）
            const darkenPct = !astro.alive ? Math.min(1, astro.grayProgress) : 0;
            const lerpHexColor = (hex1, hex2, t) => {
                if (t <= 0) return hex1;
                const r1 = parseInt(hex1.slice(1, 3), 16), g1 = parseInt(hex1.slice(3, 5), 16), b1 = parseInt(hex1.slice(5, 7), 16);
                const r2 = parseInt(hex2.slice(1, 3), 16), g2 = parseInt(hex2.slice(3, 5), 16), b2 = parseInt(hex2.slice(5, 7), 16);
                const r = Math.round(r1 + (r2 - r1) * t);
                const g = Math.round(g1 + (g2 - g1) * t);
                const b = Math.round(b1 + (b2 - b1) * t);
                return `rgb(${r}, ${g}, ${b})`;
            };

            // 配色定義 (完全依照原圖粉紅與淺藍配色，擊墜後平滑過渡至暗灰調)
            const isPink = astro.type === 'pink';
            const suitColor = lerpHexColor(isPink ? '#fbb6d3' : '#b9dcfa', '#6e7280', darkenPct);
            const highlightColor = lerpHexColor(isPink ? '#ffd4e6' : '#dcf0ff', '#8b90a0', darkenPct);
            const strokeColor = lerpHexColor('#9b8373', '#4a4852', darkenPct);
            const skinColor = lerpHexColor('#fff2df', '#8f8b88', darkenPct);
            const hairColor = lerpHexColor('#c3a17e', '#635c58', darkenPct);
            const cheekColor = lerpHexColor('#fbd0dc', '#7d777c', darkenPct);
            const bowColor = lerpHexColor('#f49cbb', '#66636e', darkenPct);

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 3.2;
            ctx.strokeStyle = strokeColor;

            // --- 1. 背後氧氣背包 ---
            ctx.fillStyle = suitColor;
            ctx.beginPath();
            ctx.roundRect(-34, -18, 68, 46, 16);
            ctx.fill();
            ctx.stroke();

            // --- 2. 左右手臂 (隨漂浮自然擺動) ---
            const waveLeft = astro.alive ? Math.sin(astro.animTime * 3.5 + astro.phaseOffset) * 0.18 : 0.25;
            const waveRight = astro.alive ? Math.cos(astro.animTime * 3.5 + astro.phaseOffset) * 0.18 : -0.25;

            // 左手 (粉紅太空人揮手較高，還原圖2/圖3可愛動態)
            ctx.save();
            ctx.translate(-29, 4);
            ctx.rotate((isPink ? 0.35 : 0.15) + waveLeft);
            ctx.fillStyle = suitColor;
            ctx.beginPath();
            ctx.roundRect(-24, -10, 28, 22, 11);
            ctx.fill();
            ctx.stroke();
            // 袖口反光線
            ctx.strokeStyle = highlightColor;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(-14, -6);
            ctx.lineTo(-14, 7);
            ctx.stroke();
            ctx.restore();

            // 右手 (淺藍太空人揮手較高)
            ctx.save();
            ctx.translate(29, 4);
            ctx.rotate((isPink ? -0.15 : -0.35) + waveRight);
            ctx.fillStyle = suitColor;
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.roundRect(-4, -10, 28, 22, 11);
            ctx.fill();
            ctx.stroke();
            // 袖口反光線
            ctx.strokeStyle = highlightColor;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(14, -6);
            ctx.lineTo(14, 7);
            ctx.stroke();
            ctx.restore();

            // --- 3. 身體與雙腿 (連身太空服) ---
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 3.2;
            ctx.fillStyle = suitColor;

            ctx.beginPath();
            // 從左上肩開始順時針繪製圓潤連身服
            ctx.moveTo(-29, -4);
            ctx.quadraticCurveTo(-34, 18, -30, 38);
            // 左腿
            ctx.lineTo(-29, 55);
            ctx.quadraticCurveTo(-29, 64, -16, 64);
            ctx.quadraticCurveTo(-4, 64, -4, 54);
            ctx.lineTo(-4, 44);
            // 褲檔弧線
            ctx.quadraticCurveTo(0, 42, 4, 44);
            // 右腿
            ctx.lineTo(4, 54);
            ctx.quadraticCurveTo(4, 64, 16, 64);
            ctx.quadraticCurveTo(29, 64, 29, 55);
            ctx.lineTo(30, 38);
            // 右側身
            ctx.quadraticCurveTo(34, 18, 29, -4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 褲管線條細節
            ctx.beginPath();
            ctx.moveTo(-29, 49);
            ctx.quadraticCurveTo(-16, 52, -4, 49);
            ctx.moveTo(4, 49);
            ctx.quadraticCurveTo(16, 52, 29, 49);
            // 褲襠分岔處車縫弧線（貼合大腿內側上方，類似嬰兒連身服）
            ctx.moveTo(-4, 43);
            ctx.quadraticCurveTo(0, 41, 4, 43);
            ctx.stroke();

            // 腿部淺色反光條
            ctx.strokeStyle = highlightColor;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-25, 44);
            ctx.lineTo(-9, 45);
            ctx.moveTo(9, 45);
            ctx.lineTo(25, 44);
            ctx.stroke();

            // 胸前圓角矩形控制面板
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2.8;
            ctx.fillStyle = suitColor;
            ctx.beginPath();
            ctx.roundRect(-16, 6, 32, 20, 6);
            ctx.fill();
            ctx.stroke();

            // --- 4. 太空頭盔外罩 ---
            ctx.fillStyle = suitColor;
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.ellipse(0, -28, 37, 34, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 領口環狀領圈
            ctx.beginPath();
            ctx.moveTo(-26, -4);
            ctx.quadraticCurveTo(0, 4, 26, -4);
            ctx.stroke();

            // --- 5. 頭盔面罩與可愛臉龐 ---
            ctx.fillStyle = skinColor;
            ctx.beginPath();
            ctx.ellipse(0, -25, 29, 24, 0, 0, Math.PI * 2);
            ctx.fill();

            // 使用頭盔內框裁切區域，確保頭髮完美貼合內框且絕不溢出
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(0, -25, 29, 24, 0, 0, Math.PI * 2);
            ctx.clip();

            // 瀏海 (保留原本可愛髮型，並嚴格限制在頭盔內框內)
            ctx.fillStyle = hairColor;
            ctx.beginPath();
            if (isPink) {
                // Luna 斜分瀏海
                ctx.arc(0, -26, 28.5, Math.PI * 1.03, Math.PI * 1.97);
                ctx.quadraticCurveTo(18, -32, 10, -37);
                ctx.quadraticCurveTo(2, -31, -6, -37);
                ctx.quadraticCurveTo(-16, -30, -28.2, -28);
            } else {
                // Haru 可愛雲朵瀏海
                ctx.arc(0, -26, 28.5, Math.PI * 1.03, Math.PI * 1.97);
                ctx.quadraticCurveTo(20, -33, 14, -37);
                ctx.quadraticCurveTo(7, -32, 0, -37);
                ctx.quadraticCurveTo(-7, -32, -14, -37);
                ctx.quadraticCurveTo(-20, -33, -28.2, -28);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // 重新描繪頭盔面罩外框線條，確保輪廓清晰完整
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.ellipse(0, -25, 29, 24, 0, 0, Math.PI * 2);
            ctx.stroke();

            // 腮紅
            ctx.fillStyle = cheekColor;
            ctx.beginPath();
            ctx.ellipse(-16, -20, 4.5, 3, 0, 0, Math.PI * 2);
            ctx.ellipse(16, -20, 4.5, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // 面罩玻璃白色高光弧線（稍微向外靠且避開腮紅與外框）
            ctx.strokeStyle = lerpHexColor('#ffffff', '#9ea2b0', darkenPct);
            ctx.lineWidth = 3.2;
            ctx.beginPath();
            if (isPink) {
                ctx.ellipse(0, -25, 25, 20.5, 0, Math.PI * 0.96, Math.PI * 1.15);
            } else {
                ctx.ellipse(0, -25, 25, 20.5, 0, Math.PI * 1.85, Math.PI * 0.04);
            }
            ctx.stroke();

            // 表情 (存活時開心微笑，受傷 3 秒內或失去夥伴 60 秒內呈現 ＞_＜ 表情，失去生命時變成暈眩表情)
            ctx.strokeStyle = strokeColor;
            ctx.fillStyle = strokeColor;
            ctx.lineWidth = 2.6;

            if (astro.alive) {
                // 判斷是否顯示 ＞_＜ 表情：
                // 1. 剩餘 1 條命時固定顯示 (astro.hp === 1)
                // 2. 受傷後 3 秒內 (hurtTimer > 0)
                // 3. 失去同伴後 1 分鐘內 (sadPartnerTimer > 0)
                // 4. 失去同伴已滿 1 分鐘，但自身生命值未滿 3 條命 (partnerLost && hp < maxHp)
                const isScaredFace = astro.hp === 1 || astro.sadPartnerTimer > 0 || astro.hurtTimer > 0 || (astro.partnerLost && astro.hp < astro.maxHp);
                const isHappyFace = astro.happyTimer > 0 || astro.buddyHappy;
                if (isScaredFace) {
                    // ＞_＜ 表情
                    ctx.lineWidth = 2.4;
                    // 左眼 ＞
                    ctx.beginPath();
                    ctx.moveTo(-14, -26.5);
                    ctx.lineTo(-9.5, -24);
                    ctx.lineTo(-14, -21.5);
                    ctx.stroke();

                    // 右眼 ＜
                    ctx.beginPath();
                    ctx.moveTo(14, -26.5);
                    ctx.lineTo(9.5, -24);
                    ctx.lineTo(14, -21.5);
                    ctx.stroke();

                    // 小鼻子
                    ctx.beginPath();
                    ctx.arc(0, -22, 2.2, Math.PI * 1.1, Math.PI * 1.9);
                    ctx.stroke();

                    // 緊閉的波浪/一字小嘴 _
                    ctx.beginPath();
                    ctx.moveTo(-4.5, -16.5);
                    ctx.quadraticCurveTo(0, -17.5, 4.5, -16.5);
                    ctx.stroke();
                } else {
                    // 豆豆眼或彎彎笑眼
                    if (isHappyFace) {
                        // 吃到愛心或雙人靠近時的彎彎笑眼 ^_^
                        ctx.beginPath();
                        ctx.arc(-11, -23, 3.2, Math.PI, 0);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(11, -23, 3.2, Math.PI, 0);
                        ctx.stroke();
                    } else {
                        // 經典可愛豆豆眼
                        ctx.beginPath();
                        ctx.ellipse(-11, -24, 1.8, 2.5, 0, 0, Math.PI * 2);
                        ctx.ellipse(11, -24, 1.8, 2.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 小鼻子
                    ctx.beginPath();
                    ctx.arc(0, -22, 2.2, Math.PI * 1.1, Math.PI * 1.9);
                    ctx.stroke();

                    // 可愛嘴巴
                    ctx.beginPath();
                    if (isHappyFace) {
                        // 開心張嘴笑 (閉合路徑，讓外框完整包住嘴巴)
                        ctx.fillStyle = '#c49a76';
                        ctx.arc(0, -17.5, 4.2, 0, Math.PI);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    } else {
                        // 溫柔微笑
                        ctx.arc(0, -18, 4.5, 0.15 * Math.PI, 0.85 * Math.PI);
                        ctx.stroke();
                    }
                }
            } else {
                // 耗盡生命時的 X X 暈眩眼與難過小嘴
                ctx.lineWidth = 2.4;
                // 左眼 X
                ctx.beginPath();
                ctx.moveTo(-14, -27);
                ctx.lineTo(-9, -22);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-9, -27);
                ctx.lineTo(-14, -22);
                ctx.stroke();

                // 右眼 X
                ctx.beginPath();
                ctx.moveTo(9, -27);
                ctx.lineTo(14, -22);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(14, -27);
                ctx.lineTo(9, -22);
                ctx.stroke();

                // 難過小嘴
                ctx.beginPath();
                ctx.arc(0, -14, 4, 1.15 * Math.PI, 1.85 * Math.PI);
                ctx.stroke();
            }

            // --- 6. Luna 頭頂右側粉色蝴蝶結 ---
            if (isPink) {
                ctx.save();
                ctx.translate(23, -44);
                ctx.rotate(0.28);
                ctx.fillStyle = bowColor;
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 2.6;

                // 左翼
                ctx.beginPath();
                ctx.moveTo(-2, 0);
                ctx.quadraticCurveTo(-13, -8, -12, 0);
                ctx.quadraticCurveTo(-13, 8, -2, 0);
                ctx.fill();
                ctx.stroke();

                // 右翼
                ctx.beginPath();
                ctx.moveTo(2, 0);
                ctx.quadraticCurveTo(13, -8, 12, 0);
                ctx.quadraticCurveTo(13, 8, 2, 0);
                ctx.fill();
                ctx.stroke();

                // 中央結扣
                ctx.beginPath();
                ctx.roundRect(-3.5, -3.5, 7, 7, 2.5);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
            // --- 7. Haru 單人模式防護罩視覺特效（完整包覆全身） ---
            if (astro.alive && astro.shieldTimer > 0) {
                const pulse = 1 + Math.sin(astro.animTime * 8) * 0.035;
                const shieldR = 84 * pulse;
                const shieldCenterY = 2;
                const alpha = astro.shieldTimer < 2.5 ? (0.35 + 0.35 * Math.sin(astro.shieldTimer * 18)) : 0.78;

                ctx.save();
                const grad = ctx.createRadialGradient(0, shieldCenterY, shieldR * 0.45, 0, shieldCenterY, shieldR);
                grad.addColorStop(0, 'rgba(185, 220, 250, 0.04)');
                grad.addColorStop(0.75, `rgba(147, 197, 253, ${0.22 * alpha})`);
                grad.addColorStop(1, `rgba(220, 240, 255, ${0.68 * alpha})`);

                ctx.fillStyle = grad;
                ctx.strokeStyle = `rgba(185, 220, 250, ${0.92 * alpha})`;
                ctx.lineWidth = 3.2;
                ctx.beginPath();
                ctx.arc(0, shieldCenterY, shieldR, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 護罩表面高光
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.72 * alpha})`;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, shieldCenterY, shieldR - 7, Math.PI * 1.15, Math.PI * 1.45);
                ctx.stroke();
                ctx.restore();
            }

            ctx.restore();
        }

        // ==========================================
        // 3. 遊戲核心狀態與物理邏輯
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        let dpr = Math.min(window.devicePixelRatio || 1, 2);

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (previewCanvas) {
                const rect = previewCanvas.getBoundingClientRect();
                if (rect.width > 0 && rect.height > 0) {
                    previewCanvas.width = rect.width * dpr;
                    previewCanvas.height = rect.height * dpr;
                    previewCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }
            }
        }
        window.addEventListener('resize', resizeCanvas);

        // 尋寶模式 10 顆柔和彩色寶珠定義
        const TREASURE_ORBS = [
            { id: 'green', name: '綠色', color: '#86efac', light: '#dcfce7', stroke: '#4ade80' },
            { id: 'red', name: '紅色', color: '#fda4af', light: '#ffe4e6', stroke: '#fb7185' },
            { id: 'cream', name: '米白色', color: '#fef3c7', light: '#fffbeb', stroke: '#fde68a' },
            { id: 'blue', name: '藍色', color: '#93c5fd', light: '#dbeafe', stroke: '#60a5fa' },
            { id: 'purple', name: '紫色', color: '#d8b4fe', light: '#f3e8ff', stroke: '#c084fc' },
            { id: 'orange', name: '橙色', color: '#fdba74', light: '#ffedd5', stroke: '#fb923c' },
            { id: 'lightgreen', name: '淺綠色', color: '#bef264', light: '#ecfccb', stroke: '#a3e635' },
            { id: 'yellow', name: '黃色', color: '#fde047', light: '#fef9c3', stroke: '#facc15' },
            { id: 'pink', name: '粉紅色', color: '#f9a8d4', light: '#fce7f3', stroke: '#f472b6' },
            { id: 'skyblue', name: '淺藍色', color: '#7dd3fc', light: '#e0f2fe', stroke: '#38bdf8' }
        ];

        // 遊戲狀態與模式變數
        let gameState = 'START'; // 'START' | 'PLAYING' | 'GAMEOVER'
        let gameMode = 'CLASSIC'; // 'CLASSIC' | 'SOLO' | 'TREASURE'
        let soloCharacter = 'pink'; // 'pink' (Luna) | 'blue' (Haru)
        let distance = 0;
        let bestDistance = parseInt(localStorage.getItem('twinAstroBest') || '0', 10);
        let difficulty = 1;
        let lastTime = 0;
        let screenShake = 0;

        // 兩位主角實體
        let astronauts = [];
        // 背景星空與星雲
        let stars = [];
        let nebulas = [];
        // 障礙物 (隕石、太空碎片、爆裂炸彈)
        let obstacles = [];
        // 回血道具、單人模式特殊球、尋寶彩色寶珠
        let items = [];
        // Luna 單人模式發射的粉色小球子彈
        let projectiles = [];
        // 尋寶模式已收集的寶珠 ID 集合
        let collectedOrbs = new Set();
        // 粒子特效與浮動文字
        let particles = [];
        let floatingTexts = [];

        // 生成計時器
        let obstacleTimer = 0;
        let itemTimer = 0;
        let specialItemTimer = 0;
